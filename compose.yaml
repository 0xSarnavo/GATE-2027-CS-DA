name: gate27

services:
  app:
    build: ./app
    restart: unless-stopped
    env_file:
      - path: .env.docker
        format: raw
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
